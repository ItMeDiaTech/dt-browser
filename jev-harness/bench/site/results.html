<!doctype html><html><head><meta charset="utf-8"><title>Search results — BenchMart</title><script src="data.js"></script></head>
<body><script>document.write(NAV)</script>
<form action="results.html" role="search"><input type="search" name="q" aria-label="Search products" id="q"><button>Search</button></form>
<h1 id="h"></h1><label>Sort by <select id="sort"><option>Relevance</option><option>Price: low to high</option><option>Price: high to low</option></select></label>
<ol id="list"></ol>
<script>
const q = new URLSearchParams(location.search).get("q") || "";
document.getElementById("q").value = q;
const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
const hits = PRODUCTS.filter(p => terms.every(t => p.tags.includes(t)) || terms.some(t => p.tags.includes(t)));
h.textContent = `${hits.length} results for "${q}"`;
const price = p => Number(p.price.replace(/[^0-9.]/g, ""));
function render() {
  const mode = document.getElementById("sort").value, rows = [...hits];
  if (mode.startsWith("Price: low")) rows.sort((a, b) => price(a) - price(b));
  if (mode.startsWith("Price: high")) rows.sort((a, b) => price(b) - price(a));
  list.innerHTML = rows.map(p => `<li><a href="product.html?id=${p.id}">${p.name}</a> <span>In stock</span> <button onclick="addToCart('${p.id}')">Add to cart</button></li>`).join("");
}
document.getElementById("sort").addEventListener("change", render); render();
document.write(FOOTER);
</script></body></html>
