<!doctype html><html><head><meta charset="utf-8"><title>Long checkout — BenchMart</title></head>
<body><h1>Checkout</h1><p>Order total: $34.99</p><p>Scroll for the payment provider.</p>
<div style="height:1600px"></div>
<h2>Payment</h2>
<iframe id="coupon" width="420" height="140" title="Coupon"></iframe>
<script>
// Cross-origin on purpose, and far below the fold: a frame origin read after scrollIntoView is in
// viewport coordinates, so hit-testing it in document coordinates is what this page catches.
const other = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
document.getElementById("coupon").src = `${location.protocol}//${other}:${location.port}/frame_scrolled_target.html`;
</script></body></html>
