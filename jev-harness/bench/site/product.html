<!doctype html><html><head><meta charset="utf-8"><title>Product — BenchMart</title><script src="data.js"></script></head>
<body><script>document.write(NAV)</script><main id="m"></main>
<script>
const p = PRODUCTS.find(x => x.id === new URLSearchParams(location.search).get("id"));
document.title = p.name + " — BenchMart";
m.innerHTML = `<h1>${p.name}</h1><p class="price">Price: ${p.price}</p><p>Ships in 1–2 business days.</p>
<label>Quantity <select><option>1</option><option>2</option><option>3</option></select></label> <button onclick="addToCart(p.id)">Add to cart</button> <button>Save for later</button>
<h2>Customers also viewed</h2><ul>${PRODUCTS.filter(x => x !== p).slice(0, 3).map(x => `<li><a href="product.html?id=${x.id}">${x.name}</a></li>`).join("")}</ul>`;
document.write(FOOTER);
</script></body></html>
